<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PC Scavenger Collector</title>
    <style>
      body { width: 280px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #020617; color: #f8fafc; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #cbd5e1; line-height: 1.4; }
      button { width: 100%; min-height: 42px; border: 0; border-radius: 999px; font-weight: 800; cursor: pointer; background: #67e8f9; color: #020617; }
      #status { margin-top: 10px; color: #86efac; }
    </style>
  </head>
  <body>
    <h1>PC Scavenger</h1>
    <p>Open Facebook Marketplace, Gumtree, eBay, or Reddit search results, then collect visible high-end listings.</p>
    <button id="collect">Collect visible listings</button>
    <p id="status">Ready.</p>
    <script src="popup.js"></script>
  </body>
</html>
